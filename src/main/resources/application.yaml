server:
  port: 8081

spring:
  application:
    name: foreign-exchange
  docker:
    compose:
      # Dev-time only (mvnw spring-boot:run): start just postgres, never the app service that
      # docker-compose.override.yaml adds for the self-contained `docker compose up` flow.
      file: docker-compose.yaml
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

frankfurter:
  client:
    url: https://api.frankfurter.dev/v2
    connect-timeout: 2s
    read-timeout: 3s

cache:
  currency-rate-pair:
    ttl: 1800s
    max-size: 1000
